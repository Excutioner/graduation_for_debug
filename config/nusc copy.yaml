dataset: 'nuscenes'
dataset_path: '/datav/DeepFusionMOT/data/nuscenes/train'
spilt: 'val'

# 注释掉此行，代表测试验证集全部 150 个场景
tracking_seqs: []  

if_cmc: 'False'
# 为了加速全集评估，建议把存图关掉，否则生成上万张图极其耗时！
save_2d_image: "False"
kfstate_2d: "xyah"

root_path: 'Debug/NUSCENES'
nusc_3d_json_path: '/datav/DeepFusionMOT/data/detections/3D/nuscenes/nusc_results_flip/infos_val_10sweeps_withvelo_filter_True.json' 
nusc_2d_json_dir: '/datav/DeepFusionMOT/data/detections/2D/mmdetection_cascade_x101/val' 

# 结果保存路径
save_path: './nus_rogdiou3d_rv_results_full'

motion_model: "CTRA"
cmc_with_rect2imu : "False"
use_fga: "False"

# 包含所有需要评测的 7 大类别
cat_list: ['car', 'truck', 'bus', 'trailer', 'pedestrian', 'motorcycle', 'bicycle']

# ==================== 1. Car (汽车) ====================
car:
  use_rv_match: "True"
  rv_metric: sdiou_2d
  rv_threshold: 0.5  
  max_ages: 3
  min_frames: 1
  metric_3d: ro_gdiou_3d_nusc
  metric_2d: iou_2d
  cost_function:
    iou_2d: 0.55
    ro_gdiou_3d_nusc: -0.25
  fga:
    high_conf: 0.4
    junk_conf: 0.1
    loc_thresh: 0.65
  cost_options:
    iou_2d_c: { w: 0.4 }
    ro_gdiou_3d_nusc: { w1: 0.5, w2: 1.5, depth_weight: 1.0 }

  micro_innovation:
    # 创新点1: 置信度引导的自适应卡尔曼滤波 (CG-AKF)
    use_cg_akf: false
    cg_akf_params:
      mu: 1.0  # 阈值
      tau: 1.0 # 灵敏调节，越大膨胀噪声越少
    # --- [新增] 2D CG-AKF 配置 ---
    use_cg_akf_2d: false    # 2D 独立开关
    cg_akf_2d_params:
      mu: 3.0           # 2D 建议值 3.0 (2D框本身较抖，惩罚不宜过大)
      tau: 1.0
    # 创新点2: 距离感知的各向异性匹配 (Distance-Aware Matching)
    use_dist_aware: false
    dist_aware_params:
      far_dist_thresh: 45.0 # 超过45米视为远距离
      far_iou_thresh: 0.25  # 远距离放宽IoU阈值 (解决深度抖动导致IoU过低的问题)
    # 3. [新增] 自适应过程噪声 CTRA (APN-CTRA)
    use_apn_ctra: false
    apn_ctra_params:
      maneuver_factor_omega: 80.0  # 角速度影响因子
      maneuver_factor_accel: 5.0  # 加速度影响因子
    # 4. [新增] 各向异性加权 Ro-GDIoU (AW-Ro-GDIoU)
    use_aw_ro_gdiou: false
    aw_ro_gdiou_params:
      depth_weight: 0.3  # 纵向(深度)惩罚权重，<1.0 表示容忍深度误差


