dataset: 'nuscenes'

dataset_path: '/datav/DeepFusionMOT/data/nuscenes'
spilt: 'training'


#----------------------------Detector--------------------------
detector_2d: 'yolox_apollo_kitti_1280'
detector_3d: 'nusc_centerpoint'


root_path: 'chapter3_end_3dcg_akf_tau2100/KITTI'
dets_path_3d: "data/detections/3D"
dets_path_2d: "data/detections/2D"
save_2d_image: "False"
# ------------------------CMC--------------------------
if_cmc: "True"
ex_cfg: "cmc_with_ex_yolox_apollo_kitti_1280/training/image_02/"
kfstate_2d: "xyah"

#------------------------Motion model--------------------------
motion_model: "CV"
# r2i默认为True，效果更好
cmc_with_rect2imu : "True"

#------------------------Dataset spilt--------------------------
tracking_seqs: [77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90, 91, 111, 112, 113, 114, 115, 116, 117, 118, 119, 140, 142, 143, 144, 145, 146, 147, 148, 265, 266, 279, 280, 281, 282, 307, 308, 309, 310, 311, 312, 313, 314, 333, 334, 335, 336, 337, 338, 339, 340, 341, 342, 343, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490, 491, 492, 493, 494, 495, 496, 497, 498, 547, 548, 549, 550, 551, 601, 602, 603, 604, 606, 607, 608, 609, 610, 611, 612, 613, 614, 615, 616, 617, 618, 619, 620, 621, 622, 623, 624, 827, 828, 829, 830, 831, 833, 834, 835, 836, 837, 838, 839, 840, 841, 842, 844, 845, 846, 932, 933, 935, 936, 937, 938, 939, 940, 941, 942, 943, 1026, 1027, 1028, 1029, 1030, 1031, 1032, 1033, 1034, 1035, 1036, 1037, 1038, 1039, 1040, 1041, 1042, 1043]

#----------------------------Category--------------------------
cat_list: ['Car']
#----------------------------Hyperparameter--------------------------
#If you want a better result, re-adjust the following hyperparameter
use_fga: "False"
remain_threshold_2d: 1
Car:
  max_ages: 25
  min_frames: 4
  metric_3d: iou_3d
  # metric_3d: ro_gdiou_3d
  metric_2d: iou_2d
  # metric_2d: iou_2d_c
  cost_function:
      iou_2d: 0.55
      iou_2d_c: 0.55
      sdiou_2d: 1.1
      giou_3d: -0.2
      # iou_3d: 0.1
      iou_3d: 0.01
      dist_3d: 1.1
      ro_gdiou_3d: -0.25
  cost_options:
    iou_2d_c:
      w: 0.4
    ro_gdiou_3d:
      w1: 0.5
      w2: 1.5
      depth_weight: 1.0 # 默认是各向同性 (1.0)
  fga:
    # FGA模式下
    # 跟踪时只使用置信度大于junk_conf的检测结果
    # 分阶段匹配时分为三类，高分(置信度大于high_conf)
    # 低分但高分类(置信度小于high_conf但分类置信度大于cls_high)
    # 低分且低分类(置信度小于high_conf且分类置信度小于cls_high)
    # 一般模式下
    # 跟踪时只使用置信度大于high_conf的检测结果
    junk_conf: 0.2
    high_conf: 0.4
    # high_conf: 0.1
    loc_thresh:  0.65
  # MCTrack 原有配置
  use_rv_match: "False"      # 是否开启MCTrack的RV二阶段匹配
  rv_metric: sdiou_2d       # RV阶段使用的度量，MCTrack论文推荐SDIoU
  rv_threshold: 0.5         # RV阶段的匹配阈值

  micro_innovation:
    # 创新点1: 置信度引导的自适应卡尔曼滤波 (CG-AKF)
    use_cg_akf: true
    cg_akf_params:
      mu: 1.0  # 阈值
      tau: 21.0 # 灵敏调节，越大膨胀噪声越少
    # --- [新增] 2D CG-AKF 配置 ---
    use_cg_akf_2d: false    # 2D 独立开关
    cg_akf_2d_params:
      mu: 3.0           # 2D 建议值 3.0 (2D框本身较抖，惩罚不宜过大)
      tau: 1.0
    # 创新点2: 距离感知的各向异性匹配 (Distance-Aware Matching)
    use_dist_aware: false
    dist_aware_params:
      far_dist_thresh: 45.0 # 超过45米视为远距离
      far_iou_thresh: 0.25  # 远距离放宽IoU阈值 (解决深度抖动导致IoU过低的问题)
    # 3. [新增] 自适应过程噪声 CTRA (APN-CTRA)
    use_apn_ctra: false
    apn_ctra_params:
      maneuver_factor_omega: 80.0  # 角速度影响因子
      maneuver_factor_accel: 5.0  # 加速度影响因子
    # 4. [新增] 各向异性加权 Ro-GDIoU (AW-Ro-GDIoU)
    use_aw_ro_gdiou: false
    aw_ro_gdiou_params:
      depth_weight: 0.3  # 纵向(深度)惩罚权重，<1.0 表示容忍深度误差

Pedestrian:
  metric_3d: iou_3d
  metric_2d: iou_2d
  max_ages: 25
  min_frames: 3
  cost_function:
      iou_2d: 0.55
      sdiou_2d: 0.2
      giou_3d: -0.2
      iou_3d: 0.01
      dist_3d: 1.1
